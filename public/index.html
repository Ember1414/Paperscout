<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperScout · 证据可溯源的学术研究工作台</title>
  <meta name="description" content="多源学术论文聚合检索：智能去重、排序可解释、证据可溯源。支持中文与英文文献，免费无登录。" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%23B8791A'/%3E%3Ccircle cx='12' cy='12' r='4' fill='%23FBFAF8'/%3E%3C/svg%3E" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- 主题防 FOUC：先于样式表执行 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ps-theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* 读取失败按亮色 */ }
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div id="app">
    <!-- 首屏骨架：JS 就绪前占位，防 CLS -->
    <div class="ps-shell" aria-hidden="true">
      <div class="ps-header"><div class="ps-header-inner"><div class="skeleton" style="width:120px;height:20px"></div></div></div>
      <div class="ps-main">
        <div class="skeleton skeleton-card"><div class="sk-line skeleton w60"></div></div>
      </div>
    </div>
  </div>
  <noscript><p style="padding:16px">PaperScout 需要 JavaScript 才能检索文献。请启用后刷新。</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
